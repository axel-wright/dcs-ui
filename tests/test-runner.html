<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DCS Component Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="../css/dcs-core.min.css?v=20260704-b4d7a14">
<link rel="stylesheet" href="../css/dcs-components.min.css?v=20260704-b4d7a14">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg, #0f172a);
    color: var(--fg, #e2e8f0);
    font-family: system-ui, -apple-system, sans-serif;
    padding: 2rem;
    min-height: 100vh;
  }
  h1 { font-size: 1.5rem; margin-bottom: 0.5rem; color: #f8fafc; }
  .subtitle { color: #64748b; margin-bottom: 2rem; }

  #results {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
    font-family: 'SF Mono', 'Fira Code', monospace;
    font-size: 0.85rem;
  }
  .result-line {
    padding: 0.35rem 0.75rem;
    border-radius: 4px;
    display: flex;
    gap: 0.75rem;
    align-items: flex-start;
  }
  .result-line.PASS { background: rgba(34, 197, 94, 0.08); }
  .result-line.FAIL { background: rgba(239, 68, 68, 0.1); }

  .result-tag {
    font-weight: 700;
    min-width: 3rem;
    flex-shrink: 0;
  }
  .result-tag.PASS { color: #22c55e; }
  .result-tag.FAIL { color: #ef4444; }

  .result-suite { color: #64748b; min-width: 8rem; flex-shrink: 0; }
  .result-msg { color: #e2e8f0; }

  #summary {
    margin-top: 1.5rem;
    padding: 1rem;
    border-radius: 8px;
    font-weight: 700;
    font-size: 1.1rem;
  }
  #summary.all-pass { background: rgba(34, 197, 94, 0.1); color: #22c55e; }
  #summary.has-fail { background: rgba(239, 68, 68, 0.1); color: #ef4444; }
  #summary.waiting { background: rgba(100, 116, 139, 0.1); color: #94a3b8; }

  #test-fixtures {
    position: fixed;
    top: 0;
    left: -9999px;
    width: 1px;
    height: 1px;
    overflow: hidden;
    pointer-events: none;
    opacity: 0;
  }
  /* Make drawer overlays visible for focus trap tests */
  .drawer-overlay.open { left: 0 !important; z-index: 1000; }

  .spinner {
    display: inline-block;
    width: 1rem;
    height: 1rem;
    border: 2px solid #64748b;
    border-top-color: #94a3b8;
    border-radius: 50%;
    animation: spin 0.6s linear infinite;
    margin-right: 0.5rem;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<h1>DCS Component Tests</h1>
<p class="subtitle">Modal · Drawer · Tabs · Accordion · Carousel</p>

<div id="summary" class="waiting">
  <span class="spinner"></span> Running tests...
</div>

<div id="results"></div>

<div id="test-fixtures"></div>

<!-- DCS Core (must load first) -->
<script src="../js/dcs-core.js"></script>

<!-- Component scripts under test -->
<script src="../js/dcs-modal.js"></script>
<script src="../js/dcs-drawer.js"></script>
<script src="../js/dcs-tabs.js"></script>
<script src="../js/dcs-accordion.js"></script>
<script src="../js/dcs-carousel.js"></script>

<!-- Test framework + tests -->
<script src="test.js"></script>
<script src="test-modal.js"></script>
<script src="test-drawer.js"></script>
<script src="test-tabs.js"></script>
<script src="test-accordion.js"></script>
<script src="test-carousel.js"></script>

<script>
(function renderResults() {
  var results = DCS_TEST.getResults();
  var container = document.getElementById('results');
  var summary = document.getElementById('summary');

  var stats = DCS_TEST.summary();
  var html = '';

  for (var i = 0; i < results.length; i++) {
    var r = results[i];
    html += '<div class="result-line ' + r.type + '">' +
      '<span class="result-tag ' + r.type + '">' + r.type + '</span>' +
      '<span class="result-suite">' + r.suite + '</span>' +
      '<span class="result-msg">' + r.msg + '</span>' +
    '</div>';
  }

  container.innerHTML = html;

  if (stats.fail === 0) {
    summary.className = 'all-pass';
    summary.innerHTML = '✓ All ' + stats.total + ' tests passed';
  } else {
    summary.className = 'has-fail';
    summary.innerHTML = '✗ ' + stats.pass + ' passed, ' + stats.fail + ' failed (' + stats.total + ' total)';
  }
})();
</script>

</body>
</html>
